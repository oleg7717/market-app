<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${message} ?: 'Объект не найден'">Объект не найден</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container p-5">
    <div class="alert alert-warning" role="alert">
        <h2 th:text="${message} ?: 'Объект не найден'">Объект не найден</h2>
        <p th:text="Упс..."></p>
        <a href="#" th:href="${returnUrl} ?: '/'"
           class="btn btn-primary"
           th:text="${buttonText} ?: 'Вернуться на главную'">Вернуться на главную</a>
    </div>
</div>
</body>
</html>
