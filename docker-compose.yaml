services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_market_db
    restart:  no
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis-container
    restart: no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./payment-service
    image: payment-service:latest
    container_name: payment-service
    restart: no
    ports:
      - "8082:8082"
    environment:
      # Liquibase переменные
      SPRING_LIQUIBASE_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=payment
      SPRING_LIQUIBASE_USERNAME: postgres
      SPRING_LIQUIBASE_PASSWORD: password
      # Реактивное подключение к PostgreSQL
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/postgres?currentSchema=payment
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: password
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
