services:
  #### Infrastructure ####
  postgres:
    image: postgres:15-alpine
    container_name: postgres_market_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  #### Security infrastructure ####
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres_db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8090:8080"
    command: ["start-dev"]
    depends_on:
      - postgres
    networks:
      - app-network
      - security-network

  keycloak-postgres:
    image: postgres:15-alpine
    container_name: keycloak_postgres_db
    restart:  always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      security-network:
        aliases:
          - keycloak-postgres


  #### Services ####
  payment-service:
    build: ./payment-service
    image: payment-service:latest
    container_name: payment-service
    restart: no
    ports:
      - "8081:8081"
    environment:
      # Liquibase переменные
      SPRING_LIQUIBASE_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=payment
      SPRING_LIQUIBASE_USERNAME: ${POSTGRES_USER}
      SPRING_LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Реактивное подключение к PostgreSQL
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/postgres?currentSchema=payment
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  online-store:
    build: ./online-store
    image: online-store:latest
    container_name: online-store
    restart: no
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Реактивное подключение к PostgreSQL
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/postgres?currentSchema=market
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      # Подключение к Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Настройки клиентского сервиса для получения токенов из keycloak
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MARKET_CLIENT_ID: ${MARKET_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MARKET_CLIENT_SECRET: ${MARKET_CLIENT_SECRET}
    networks:
      - app-network

#### Networks ####
networks:
  app-network:
    driver: bridge
  security-network:
    driver: bridge

#### Volumes ####
volumes:
  postgres_data:
  redis_data:
  postgres_keycloak_data:
