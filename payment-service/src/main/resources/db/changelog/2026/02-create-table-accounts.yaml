databaseChangeLog:
- changeSet:
    id: 2
    author: o.goncharenko
    changes:
      - createTable:
          tableName: accounts
          schemaName: payment
          columns:
            - column:
                name: id
                type: bigserial
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: user_name
                type: varchar(50)
                constraints:
                  nullable: false
            - column:
                name: balance
                type: double precision
                constraints:
                  nullable: false

      - sql:
          sql: ALTER TABLE payment.accounts ADD CONSTRAINT balance_non_negative CHECK (balance >= 0)

    rollback:
      - dropTable:
          tableName: accounts
          schemaName: payment