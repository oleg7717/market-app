openapi: 3.0.3
info:
  title: Payment API
  description: Сервис совершения платежей
  version: 0.0.1
servers:
  - url: http://localhost:8081
    description: Local development server
paths:
  /api/balance:
    get:
      summary: Подтверждение баланса пользователя
      description: Получить подтверждение, что на балансе пользователя достаточно средств для осуществления покупки
      parameters:
        - name: userName
          description: Логин пользователя
          in: query
          required: true
          schema:
            type: string
            example: oleg
        - name: orderAmount
          description: Сумма заказа
          in: query
          required: true
          schema:
            type: number
            format: double
            example: 238731.17
      responses:
        '200':
          description: Баланс счета получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
    post:
      summary: Осуществление платежа
      description: Осуществление платежа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        200:
          description: Платеж осуществлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
components:
  schemas:
    PaymentStatus:
      type: object
      properties:
        message:
          type: string
        processed:
          type: boolean
        code:
          type: integer
    Payment:
      type: object
      description: Параметры запроса на списание средств
      properties:
        userName:
          type: string
          example: 1
        orderAmount:
          type: number
          format: double
          example: 150.00
